name: NAHPU-Releases

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  # Windows is distributed solely through the Microsoft Store and is therefore
  # not built here.
  #
  # Pinned to ubuntu-22.04 rather than ubuntu-latest so every Linux artifact
  # shares a glibc 2.35 floor. Building on 24.04 would bind the tarball and the
  # packages to glibc 2.39, which fails at launch on Ubuntu 22.04, Debian 12,
  # and RHEL 9 with a loader error rather than a dependency error.
  release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: |
          flutter pub get
          flutter analyze

      # The Native Assets build hook shells out to rustup and relies on it
      # auto-installing the channel and cross-compilation targets declared in
      # rust/rust-toolchain.toml. Pinning a separate toolchain here would leave
      # those targets uninstalled, so warm the pinned one instead.
      - name: Setup Rust
        working-directory: rust
        run: rustup show active-toolchain

      - name: Build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          flutter build linux --release

      # cargo's release profile keeps debug info, so the library arrives at
      # roughly 45 MB. Strip before it is copied into any artifact.
      - name: Strip the Rust library
        run: strip --strip-unneeded build/linux/x64/release/bundle/lib/librust_lib_nahpu.so

      - name: Compress Linux
        run: |
          echo "Compressing files..."
          mkdir nahpu
          cp -r build/linux/x64/release/bundle/* nahpu
          tar -czvf nahpu.tar.gz nahpu

      - name: Resolve package version
        run: |
          echo "NAHPU_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NAHPU_BUILD_NUMBER=$(awk -F'+' '/^version:/ {print $2; exit}' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i /tmp/nfpm.deb

      # nfpm reads the armored private key directly and does not need gpg, so
      # the key only has to reach the filesystem. Use an RSA key: nfpm signs
      # with ed25519 too, but older rpm builds cannot verify EdDSA signatures.
      - name: Stage the RPM signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$GPG_PRIVATE_KEY" > "${RUNNER_TEMP}/nahpu-signing.asc"
          echo "NFPM_RPM_SIGNING_KEY=${RUNNER_TEMP}/nahpu-signing.asc" >> "$GITHUB_ENV"

      - name: Build deb and rpm
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p dist
          # Stable filenames so the docs can link through
          # releases/latest/download/. The version stays in the package
          # metadata, where dpkg -I and rpm -qip report it.
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/nahpu-Linux-x86_64.deb
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/nahpu-Linux-x86_64.rpm

      - name: Remove the RPM signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/nahpu-signing.asc"

      - name: Upload Linux tarball
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nahpu.tar.gz
          asset_name: nahpu-Linux-x86_64.tar.gz
          tag: ${{ github.ref_name }}

      - name: Upload deb
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/nahpu-Linux-x86_64.deb
          asset_name: nahpu-Linux-x86_64.deb
          tag: ${{ github.ref_name }}

      - name: Upload rpm
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/nahpu-Linux-x86_64.rpm
          asset_name: nahpu-Linux-x86_64.rpm
          tag: ${{ github.ref_name }}

  # Snapcraft builds in its own LXD container, which brings its own Flutter
  # SDK, rustup toolchain, and system dependencies. It therefore shares no
  # setup with the release job above.
  snap:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload snap to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build.outputs.snap }}
          asset_name: nahpu-Linux-x86_64.snap
          tag: ${{ github.ref_name }}

      - name: Publish to the Snap Store
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
