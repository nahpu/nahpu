name: NAHPU-Releases

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: |
          flutter pub get
          flutter analyze

      # The Native Assets build hook shells out to rustup and relies on it
      # auto-installing the channel and cross-compilation targets declared in
      # rust/rust-toolchain.toml. Pinning a separate toolchain here would leave
      # those targets uninstalled, so warm the pinned one instead.
      - name: Setup Rust
        working-directory: rust
        run: rustup show active-toolchain

      - name: Build Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          flutter build linux --release

      - name: Build Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          flutter build windows --release

      - name: Compress Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          echo "Compressing files..."
          mkdir nahpu
          mv build/linux/x64/release/bundle/* nahpu
          tar -czvf nahpu.tar.gz nahpu

      - name: Compress Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          echo "Creating folder..."
          mkdir nahpu
          echo "Compressing files..."
          mv build\windows\x64\runner\Release\* nahpu
          powershell Compress-Archive -Path nahpu -DestinationPath nahpu.zip

      - name: Upload Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nahpu.tar.gz
          asset_name: nahpu-Linux-x86_64.tar.gz
          tag: ${{ github.ref_name }}

      - name: Upload Windows
        if: ${{ matrix.os == 'windows-latest' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nahpu.zip
          asset_name: nahpu-Windows-x86_64.zip
          tag: ${{ github.ref_name }}

  # Snapcraft builds in its own LXD container, which brings its own Flutter
  # SDK, rustup toolchain, and system dependencies. It therefore shares no
  # setup with the release job above.
  snap:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload snap to the release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ steps.build.outputs.snap }}
          asset_name: nahpu-Linux-x86_64.snap
          tag: ${{ github.ref_name }}

      - name: Publish to the Snap Store
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable
