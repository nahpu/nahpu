name: NAHPU-Releases

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  # Windows is distributed solely through the Microsoft Store and is therefore
  # not built here.
  #
  # Pinned to ubuntu-22.04 (and its arm64 twin) rather than ubuntu-latest so
  # every Linux artifact shares a glibc 2.35 floor. Building on 24.04 would bind
  # the tarball and the packages to glibc 2.39, which fails at launch on Ubuntu
  # 22.04, Debian 12, and RHEL 9 with a loader error rather than a dependency
  # error.
  #
  # Each architecture builds natively on its own runner; Flutter cannot
  # cross-compile Linux desktop apps. The builds only upload workflow artifacts,
  # and the publish job attaches them to the release once both succeed, so a
  # failed architecture never leaves a half-populated release.
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            flutter_arch: x64
            pkg_arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            flutter_arch: arm64
            pkg_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      ASSET_PREFIX: nahpu-Linux-${{ matrix.arch }}
      BUNDLE_DIR: build/linux/${{ matrix.flutter_arch }}/release/bundle
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Flutter
        if: matrix.arch == 'x86_64'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      # flutter-action resolves SDK archives from Flutter's release index, which
      # has no Linux arm64 builds. A git checkout of the same channel works on
      # any host and downloads the arm64 engine on first run.
      - name: Setup Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "${RUNNER_TEMP}/flutter"
          echo "${RUNNER_TEMP}/flutter/bin" >> "$GITHUB_PATH"

      - run: |
          flutter --version
          flutter pub get

      # Analysis does not depend on the architecture, so run it once.
      - name: Analyze
        if: matrix.arch == 'x86_64'
        run: flutter analyze

      # The Native Assets build hook shells out to rustup and relies on it
      # auto-installing the channel and cross-compilation targets declared in
      # rust/rust-toolchain.toml. Pinning a separate toolchain here would leave
      # those targets uninstalled, so warm the pinned one instead.
      - name: Setup Rust
        working-directory: rust
        run: rustup show active-toolchain

      - name: Build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          flutter build linux --release

      # cargo's release profile keeps debug info, so the library arrives at
      # roughly 45 MB. Strip before it is copied into any artifact.
      - name: Strip the Rust library
        run: strip --strip-unneeded "${BUNDLE_DIR}/lib/librust_lib_nahpu.so"

      - name: Compress Linux
        run: |
          echo "Compressing files..."
          mkdir nahpu dist
          cp -r "${BUNDLE_DIR}"/* nahpu
          tar -czvf "dist/${ASSET_PREFIX}.tar.gz" nahpu

      - name: Resolve package version
        run: |
          echo "NAHPU_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NAHPU_BUILD_NUMBER=$(awk -F'+' '/^version:/ {print $2; exit}' pubspec.yaml)" >> "$GITHUB_ENV"

      - name: Install nfpm
        env:
          NFPM_VERSION: "2.47.0"
        run: |
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${{ matrix.pkg_arch }}.deb"
          sudo dpkg -i /tmp/nfpm.deb

      # nfpm reads the armored private key directly and does not need gpg, so
      # the key only has to reach the filesystem. Use an RSA key: nfpm signs
      # with ed25519 too, but older rpm builds cannot verify EdDSA signatures.
      - name: Stage the RPM signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$GPG_PRIVATE_KEY" > "${RUNNER_TEMP}/nahpu-signing.asc"
          echo "NFPM_RPM_SIGNING_KEY=${RUNNER_TEMP}/nahpu-signing.asc" >> "$GITHUB_ENV"

      - name: Build deb and rpm
        env:
          NFPM_ARCH: ${{ matrix.pkg_arch }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # nfpm.yaml reads the bundle from a fixed path because nfpm does not
          # expand variables in `src`.
          mkdir -p build/linux/package
          cp -a "${BUNDLE_DIR}" build/linux/package/bundle
          # Stable filenames so the docs can link through
          # releases/latest/download/. The version stays in the package
          # metadata, where dpkg -I and rpm -qip report it.
          nfpm package -f packaging/nfpm.yaml -p deb -t "dist/${ASSET_PREFIX}.deb"
          nfpm package -f packaging/nfpm.yaml -p rpm -t "dist/${ASSET_PREFIX}.rpm"

      - name: Remove the RPM signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/nahpu-signing.asc"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: dist

      - name: List release files
        run: ls -lh dist

      - name: Upload Linux release files
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/nahpu-Linux-*
          file_glob: true
          tag: ${{ github.ref_name }}
          # Set only when this step creates the release; an existing release
          # keeps its notes. The changelog link follows main, since entries are
          # often written after the tag is pushed.
          body: |
            ## What's new

            See [CHANGELOGS.md](https://github.com/nahpu/nahpu/blob/main/CHANGELOGS.md) for the changes in ${{ github.ref_name }}.

            ## Installation

            Installation instructions for every platform are at https://nahpu.app/en/installation/.
