name: NAHPU-Releases

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    strategy:
      matrix:
        os: ["windows-latest", "ubuntu-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17.x"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: |
          flutter pub get
          flutter analyze

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build Linux & Android
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          sudo apt-get update
          sudo apt-get install clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
          flutter build linux --release
          flutter build apk --release

      - name: Build Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          flutter build windows --release

      - name: Compress Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          echo "Compressing files..."
          mkdir nahpu
          mv build/linux/x64/release/bundle/* nahpu
          tar -czvf nahpu.tar.gz nahpu

      - name: Compress Windows
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          echo "Creating folder..."
          mkdir nahpu
          echo "Compressing files..."
          mv build\windows\x64\runner\Release\* nahpu
          powershell Compress-Archive -Path nahpu -DestinationPath nahpu.zip

      - name: Upload Linux
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nahpu.tar.gz
          asset_name: nahpu-Linux-x86_64.tar.gz
          tag: ${{ github.ref_name }}

      - name: Upload Android
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/app/outputs/flutter-apk/app-release.apk
          asset_name: nahpu-Android.apk
          tag: ${{ github.ref_name }}

      - name: Upload Windows
        if: ${{ matrix.os == 'windows-latest' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: nahpu.zip
          asset_name: nahpu-Windows-x86_64.zip
          tag: ${{ github.ref_name }}
