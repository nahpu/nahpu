name: nahpu
description: Nahpu is a cross-platform cataloging app for natural history specimen collection.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+36

environment:
  sdk: ">=3.10.0 <=4.1.0"
  flutter: ">=3.38.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  flutter_speed_dial: ^7.0.0
  drift: 2.34.0
  path_provider: ^2.0.15
  path: ^1.8.2
  uuid: ^4.1.0
  url_launcher: ^6.1.5
  intl: ^0.20.0
  http: ^1.2.0
  crypto: ^3.0.6
  freezed_annotation: ^3.0.0
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.1.1
  fl_chart: ^1.0.0
  camera: ^0.11.2+1
  image_picker: ^1.0.0
  share_plus: ^13.1.0
  exif: ^3.1.4
  package_info_plus: ^10.1.0
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.7
  file_selector: ^1.0.0
  file_picker: ^12.0.0-beta.7
  geolocator: ^14.0.0
  flutter_rust_bridge: 2.12.0
  mobile_scanner: ^7.0.0
  sqlite3: ^3.1.5
  rust_lib_nahpu:
    path: rust_builder
  timezone: ^0.11.0
  material_ui: ^0.0.1
  qr: ^4.0.0
  flutter_markdown_plus: ^1.0.7
  flex_color_picker: ^3.8.0
  google_fonts: ^8.1.0
  pdfrx: ^2.4.7
  flutter_map: ^8.3.1
  flutter_map_pmtiles: ^1.0.5
  pmtiles: ^1.2.0
  latlong2: ^0.9.1
  maplibre: ^0.3.5
  maplibre_webview: ^0.3.5
  video_player: ^2.13.0
  fvp: ^0.37.3
  record: ^7.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.34.0
  build_runner: ^2.2.0
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter_launcher_icons:
  ios: true
  android: true
  image_path_ios: "assets/launcher/ios/iosNahpuIcon-iOS-Default-1024x1024@1x.png"
  image_path_ios_dark_transparent: "assets/launcher/ios/iosNahpuIcon-iOS-Dark-1024x1024@1x.png"
  image_path_ios_tinted_grayscale: "assets/launcher/ios/iosNahpuIcon-iOS-TintedLight-1024x1024@1x.png"
  desaturate_tinted_to_grayscale_ios: true
  image_path_android: "assets/launcher/nahpu-bg.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#f4f1de"
  adaptive_icon_foreground: "assets/launcher/nahpu-no-bg.png"
  windows:
    generate: true
    image_path: "assets/launcher/nahpu-light.png"
  macos:
    generate: true
    image_path: "assets/launcher/ios/iosNahpuIcon-iOS-Default-1024x1024@1x.png"
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # These assets are bundled with the application.
  # Do not add assets/web here. They are not used inside the app bundle.
  assets:
    - assets/logo/
    - assets/avatars/
    - assets/icons/
    - assets/configs/
    - assets/maps/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: "Merriweather"
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Merriweather-Light.ttf
          weight: 300
        - asset: assets/fonts/Merriweather-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Merriweather-Black.ttf
          weight: 900
        - asset: assets/fonts/Merriweather-BlackItalic.ttf
          weight: 900
          style: italic
    - family: "NahpuIcons"
      fonts:
        - asset: assets/fonts/nahpu_font.ttf
    - family: "DejaVuSans"
      fonts:
        - asset: assets/fonts/DejaVuSans.ttf
        - asset: assets/fonts/DejaVuSans-Bold.ttf
          weight: 700
    - family: "DejaVuSerif"
      fonts:
        - asset: assets/fonts/DejaVuSerif.ttf
        - asset: assets/fonts/DejaVuSerif-Bold.ttf
          weight: 700
        - asset: assets/fonts/DejaVuSerif-Italic.ttf
          style: italic
    - family: "LibertinusSans"
      fonts:
        - asset: assets/fonts/LibertinusSans-Regular.ttf
        - asset: assets/fonts/LibertinusSans-Italic.ttf
          style: italic
        - asset: assets/fonts/LibertinusSans-Bold.ttf
          weight: 700
    - family: "LibertinusSerif"
      fonts:
        - asset: assets/fonts/LibertinusSerif-Regular.ttf
        - asset: assets/fonts/LibertinusSerif-Italic.ttf
          style: italic
        - asset: assets/fonts/LibertinusSerif-Bold.ttf
          weight: 700
    - family: "PlusJakartaSans"
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
