  <path class="art-contour" d="M18 196C94 180 172 206 266 194C358 182 442 206 544 190C604 180 648 192 672 188" fill="none" stroke="#718e78" stroke-width="1" stroke-dasharray="4 6" stroke-linecap="round"/>

