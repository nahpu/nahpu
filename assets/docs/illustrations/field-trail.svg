  <polygon class="art-paper-page" points="78,176 96,148 114,176" fill="#fbf8f1" stroke="#405847" stroke-width="1.4" stroke-linejoin="round"/>
  <polygon class="art-tree" points="96,148 103,176 89,176" fill="#718e78"/>
  <path class="art-arrow" d="M96 148V136L106 140L96 144" fill="none" stroke="#405847" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

