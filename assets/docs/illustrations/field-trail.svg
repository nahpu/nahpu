  <path class="art-tree" d="M244 182L256 150L268 182ZM248 166L256 144L264 166ZM412 188L426 152L440 188ZM416 170L426 144L436 170ZM166 184L176 158L186 184ZM576 178L588 148L600 178Z" fill="#718e78"/>
