  <path class="art-trail-line" d="M18 162H52C93 162 93 92 134 92C175 92 175 144 216 144C257 144 257 72 298 72C339 72 339 152 380 152C421 152 421 82 462 82C503 82 503 142 544 142C586 142 586 76 628 76H662" fill="none" stroke="#688a2c" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="2 7"/>
