<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" aria-hidden="true">
  <!-- Artwork only: waypoint buttons come from the page, placed with figures.json. -->

  <!-- Sun with soft outer halo -->
  <circle class="art-sun-halo" cx="76" cy="46" r="28" fill="#e8f1d2"/>
  <circle class="art-sun" cx="76" cy="46" r="17" fill="#b5d177"/>

  <!-- Distant mountain range -->
  <path class="art-mountain-far" d="M360 156L424 72L472 114L528 38L582 96L622 52L680 114V156Z" fill="#e4ecee"/>
  <!-- Mid-ground alpine peaks and ridge lines -->
  <path class="art-mountain" d="M468 156L538 42L592 104L632 58L680 118V156Z" fill="#cdd9dd"/>
  <path class="art-leader" d="M538 42L548 76L532 94M632 58L640 84L626 98" fill="none" stroke="#8199a2" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rolling foothills and foreground meadow -->
  <path class="art-hill-back" d="M0 220V162C92 140 184 176 286 156C388 136 472 168 566 146C616 134 652 144 680 138V220Z" fill="#e2e9e3"/>
  <path class="art-hill" d="M0 220V182C84 164 168 196 262 182C354 168 434 198 532 178C600 164 644 182 680 174V220Z" fill="#c5d3c8"/>

