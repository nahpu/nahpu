[package]
name = "rust_lib_nahpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
nahpu_archive = "0.2.0"
nahpu_db = "0.5.1"
nahpu_export = "0.5.0"
nahpu_gis = "0.5.0"
serde_json = "1.0.150"
nahpu_configs = "0.7.1"
nahpu_dwc = "0.4.3"
nahpu_dp = "0.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

