[package]
name = "rust_lib_nahpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
nahpu_archive = "0.1.0"
nahpu_db = "0.4.0"
nahpu_export = "0.3.0"
nahpu_gis = "0.1.1"
serde_json = "1.0.150"

[patch.crates-io]
nahpu_gis = { path = "../../../Rust/nahpu_api/crates/nahpu_gis" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

