[package]
name = "rust_lib_nahpu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
nahpu_archive = "0.1.0"
nahpu_db = "0.4.1"
nahpu_export = "0.3.3"
nahpu_gis = "0.2.0"
serde_json = "1.0.150"
nahpu_configs = { version = "0.4.1", path = "../../../Rust/nahpu_api/crates/nahpu_configs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
